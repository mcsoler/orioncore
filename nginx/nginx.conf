# Configuración global. Los server blocks están en templates/ (http o https,
# según NGINX_MODE) y las rutas de la app en snippets/app.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # DNS interno de Docker: al usar variables en proxy_pass, Nginx vuelve a
    # resolver el nombre del servicio cuando un contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Anti fuerza bruta en el login y límite general para la API
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    # Generado por la imagen de Nginx a partir de templates/<NGINX_MODE>.conf.template
    include /etc/nginx/conf.d/*.conf;
}
