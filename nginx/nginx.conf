# Único punto de entrada: / → frontend (Astro), /api → backend (FastAPI).
# Frontend y backend no publican puertos; solo son accesibles a través de Nginx.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # DNS interno de Docker: al usar variables en proxy_pass, Nginx vuelve a
    # resolver el nombre del servicio cuando un contenedor se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Anti fuerza bruta en el login y límite general para la API
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set $backend  http://backend:8000;
        set $frontend http://frontend:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /api/auth/token {
            limit_req zone=login burst=5 nodelay;
            proxy_pass $backend;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass $backend;
        }

        location = /health {
            access_log off;
            proxy_pass $backend;
        }

        # Swagger de FastAPI (incluye el botón Authorize para probar con token)
        location ~ ^/(docs|openapi\.json)$ {
            proxy_pass $backend;
        }

        location / {
            proxy_pass $frontend;
        }
    }
}
