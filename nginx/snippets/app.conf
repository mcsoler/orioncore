# Rutas de la app, compartidas por los modos http y https.
# / → frontend (Astro), /api → backend (FastAPI)

client_max_body_size 1m;

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

set $backend  http://backend:8000;
set $frontend http://frontend:3000;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location = /api/auth/token {
    limit_req zone=login burst=5 nodelay;
    proxy_pass $backend;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass $backend;
}

location = /health {
    access_log off;
    proxy_pass $backend;
}

# Swagger de FastAPI (incluye el botón Authorize para probar con token)
location ~ ^/(docs|openapi\.json)$ {
    proxy_pass $backend;
}

location / {
    proxy_pass $frontend;
}
